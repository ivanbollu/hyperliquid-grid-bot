# ==========================================================================
#  Hyperliquid 触发单（条件单）实例 —— ETH 到价买入
#
#  想要的效果：ETH/USDC 永续合约，价格到达 2505 时买入。
#  做法：把一张限价买单挂在 2505，价格跌下来就自动成交；
#        成交后不挂止盈止损，仓位交给你手动管理。
#
#  改完保存后需要【重新启动实例】才生效（不做热加载，避免配置漂移）。
#  这个文件里的注释在网页改配置、绑定钱包时都会保留，可以放心写说明。
# ==========================================================================

slot: eth-buy-2505

# 策略类型：grid(网格+马丁) | trigger(触发单/条件单)
# 下面 grid / martingale 两段对本实例不生效，留着是为了随时能切回网格策略。
strategy: trigger

# ---------------- 运行环境 ----------------
env:
  network: mainnet            # mainnet(主网) | testnet(测试网)
  # dry_run = true 时：照常连行情、把触发单挂上去并记录日志，但【不下真实订单】。
  # 先用它确认挂单价位、数量、日志都符合预期，再改成 false 上真钱。
  dry_run: false
  # 用 API 钱包（Agent Wallet）交易时，这里必须填【主钱包】地址，不要填 API 钱包地址。
  # 用主钱包私钥交易时留空即可；网页上「连接钱包 → 绑定为交易账户」会自动填这一项。
  account_address: '0x'

# ---------------- 交易标的与仓位 ----------------
market:
  coin: ETH                   # 交易对（Hyperliquid 的 ETH 永续以 USDC 计价）
  leverage: 5                 # 杠杆倍数
  margin_mode: isolated       # isolated(逐仓) | cross(全仓)
  base_size: 0.01             # 本策略不用这一项（属于网格参数），保留仅为切换策略方便
  reduce_only_tp: true        # 止盈单用 reduce-only（只减仓，不会反向开仓）
  close_slippage_pct: 1.0     # 熔断/一键平仓时的市价滑点容忍（%）

# ---------------- 触发单参数（strategy=trigger 时生效） ----------------
trigger:
  side: buy                   # buy=买入 | sell=卖出
  price: 2503                 # 触发价。limit 模式=挂单价；market 模式=穿越判定价
  # 下单数量（以币计，不是 USD）。按"买入 11 USDC"折算：11 / 2505 ≈ 0.0044 ETH。
  # ⚠ Hyperliquid 永续合约单笔名义价值不得低于 $10，低于会被交易所直接拒单。
  #   0.001 ETH ≈ $2.5 会被拒；ETH 数量步长 0.0001，最小能过线的单是 0.004 ETH ≈ $10.02。
  #   本实例 0.0044 ETH ≈ $11.02，刚好在 $11 附近且稳过 $10 下限。
  size: 0.0044
  order_type: limit           # limit=限价单挂在盘口等成交 | market=价格穿越后立即市价成交
  max_slippage_pct: 0.5       # 仅 market 模式使用：市价单的滑点容忍（%）
  once: true                  # true=成交后视为完成，不再补挂；false=成交后重新挂单等下一轮
  tp_pct: 0                   # >0 时成交后自动挂 reduce-only 止盈（%）；0=不挂

# ---------------- 网格参数（本实例不生效，切回 grid 策略才用） ----------------
grid:
  mode: long
  anchor_price: 0
  step_pct: 0.8
  levels: 8
  take_profit_pct: 0.8
  reanchor: false
  recenter_threshold_pct: 6.0

# ---------------- 马丁加仓（本实例不生效） ----------------
martingale:
  enabled: true
  multiplier: 1.4
  max_size_multiple: 8.0

# ---------------- 风控（不要随手调大） ----------------
risk:
  max_total_notional_usd: 500 # 名义持仓上限（USD）。本单 ≈$11，离上限还很远
  max_open_orders: 24         # 同时在交易所挂着的订单数上限
  # 浮亏熔断线：成交后持仓浮亏超过这个金额，就撤单 → 市价平仓 → 停机冷却。
  # ⚠ 这是本策略唯一的自动止损，本单名义价值只有 $12.5，正常不会触发。
  max_unrealized_loss_usd: 60
  max_position_size: 0.5      # 净持仓上限（币）。本单 0.0044，远低于上限
  # 权益下限：账户总权益低于此值就拒绝启动 / 熔断。
  # 注意统一账户下「永续 accountValue」与「现货 USDC」是同一笔钱的两个视角，
  # 机器人取两者较大值作为权益，不会相加。
  # 本单名义 $11、5 倍杠杆只占用约 $2.20 保证金，$10 已经留了 4 倍余量。
  min_account_value_usd: 10
  max_daily_orders: 200       # 每日下单笔数上限
  cooldown_after_stop_sec: 3600 # 熔断后的冷却时间（秒），期间拒绝重启

# ---------------- 运行参数 ----------------
runtime:
  loop_interval_sec: 5        # 主循环间隔（秒）
  log_level: INFO             # DEBUG | INFO | WARNING
  equity_interval_sec: 30     # 权益曲线采样间隔（秒）

# ---------------- Telegram 通知（可选） ----------------
notify:
  enabled: false
  telegram_bot_token: ''      # 从 @BotFather 拿；网页上留空表示不修改已保存的值
  telegram_chat_id: ''
  on_stop: true               # 启动/停止/熔断时推送
  on_fill: false              # 每次成交都推送（触发单成交建议开 true）
