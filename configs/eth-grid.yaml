# ==========================================================================
#  Hyperliquid 网格 + 马丁 交易机器人 —— 实例配置
#
#  文件名 = 实例名。configs/ 下每个 yaml 就是一个独立实例，
#  各自有独立的线程、状态文件和日志，互不干扰。
#
#  改完保存后需要【重新启动实例】才生效（不做热加载，避免配置漂移）。
#  这个文件里的注释在网页改配置、绑定钱包时都会保留，可以放心写说明。
# ==========================================================================

slot: eth-grid

# 策略类型：grid(网格+马丁) | trigger(触发单/条件单)
# 想在同一个标的上做「到价买一笔」而不是铺网格时，把它改成 trigger 并填下面的 trigger 段。
strategy: grid

# ---------------- 运行环境 ----------------
env:
  network: mainnet            # mainnet(主网) | testnet(测试网)
  # dry_run = true 时：照常连行情、算网格、记日志，但【不下真实订单】。
  # 第一次务必保持 true 跑 1-2 小时，确认挂单价格、层数、日志符合预期，
  # 再改成 false 上真钱。
  dry_run: true               # 入金 + 买完 ETH 现货后，先干跑 1~2 小时再改 false
  # 用 API 钱包（Agent Wallet）交易时，这里必须填【主钱包】地址，不要填 API 钱包地址。
  # 用主钱包私钥交易时，留空即可。
  # 网页上「连接钱包 → 绑定为交易账户」会自动填这一项。
  # 用 API 钱包（Agent Wallet）下单时，必须填主钱包地址（.env 里放 API 钱包私钥）。
  # 这是你的主钱包；.env 里的私钥是授权给它的 API 钱包。
  account_address: '0x'

# ---------------- 交易标的与仓位 ----------------
market:
  coin: ETH                   # 交易对，如 ETH / BTC / SOL
  leverage: 5                 # 杠杆倍数。网格不要开高杠杆，建议 3~5
  margin_mode: isolated       # isolated(逐仓) | cross(全仓)
  base_size: 0.01             # 第 1 层的基础下单量（以币计，不是 USD）
  reduce_only_tp: true        # 止盈单用 reduce-only（只减仓，不会反向开仓）
  close_slippage_pct: 1.0     # 熔断/一键平仓时的市价滑点容忍（%）

# ---------------- 网格参数 ----------------
# 规模基准（2026-10-12 按「200 USDC 保证金 / 5x」核定，改任何一项前先看这个）：
#   base_size 0.01 + 马丁 1.4x + 8 层 + 0.8% 格距
#   → 8 层全部成交时：累计名义 ≈ $773，累计持仓 ≈ 0.3182 ETH，均价 ≈ $2431
#   → 峰值占用保证金 ≈ $155（占 200 的 77%），全层成交后爆仓价 ≈ $1830（较现价 -28.3%）
#   → 随时用 `python tools/grid_plan.py --margin 200 --stress` 复核
#   想要更激进就把 base_size 提到 0.0128（峰值名义 ≈ $1000、占满保证金），但不建议。
grid:
  mode: long                  # long(做多网格) | short(做空网格) | neutral(双向)
  anchor_price: 0             # 锚定价，0 = 用启动时的市场中间价自动锚定
  step_pct: 0.8               # 每层之间的间距（%）
  levels: 8                   # 向下铺多少层
  take_profit_pct: 0.8        # 每层建仓后挂的止盈幅度（%）
  reanchor: false             # 价格脱离区间后是否自动重新锚定
  recenter_threshold_pct: 6.0 # 偏离超过这个比例触发重锚（%）

# ---------------- 马丁加仓 ----------------
martingale:
  enabled: true
  multiplier: 1.4             # 每深一层的下单量倍数（1.0 = 等量网格）
  max_size_multiple: 8.0      # 单笔放大的硬上限，防止越滚越夸张

# ---------------- 风控（不要随手调大） ----------------
risk:
  # 200 保证金 × 5x = 1000 名义能力；8 层铺满约 781，设 900 才能让第 8 层挂得出去
  # （旧值 500 会在第 7 层就被拦住，8 层永远铺不满）
  max_total_notional_usd: 900 # 名义持仓上限（USD）—— 超了就不再新挂单
  max_open_orders: 24         # 同时在交易所挂着的订单数上限
  # 浮亏熔断线。触发后：撤单 → 市价平仓 → 停机冷却。
  # 这是马丁策略唯一真正踩得住的刹车，别为了"想扛单"去调大它。
  max_unrealized_loss_usd: 60
  max_position_size: 0.5      # 净持仓上限（币）
  # 兜底刹车（真正先踩下的是上面 60 的浮亏熔断，这条防的是权益被慢慢磨光）
  min_account_value_usd: 80   # 账户权益低于这个值直接停机
  max_daily_orders: 200       # 每日下单笔数上限（防止失控刷单）
  cooldown_after_stop_sec: 3600 # 熔断后的冷却时间（秒），期间拒绝重启

# ---------------- 运行参数 ----------------
runtime:
  loop_interval_sec: 5        # 主循环间隔（秒）
  log_level: INFO             # DEBUG | INFO | WARNING
  equity_interval_sec: 30     # 权益曲线采样间隔（秒）

# ---------------- Telegram 通知（可选） ----------------
notify:
  enabled: false
  telegram_bot_token: ''      # 从 @BotFather 拿；网页上留空表示不修改已保存的值
  telegram_chat_id: ''
  on_stop: true               # 启动/停止/熔断时推送
  on_fill: false              # 每次网格止盈都推送（比较频繁，按需开启）
